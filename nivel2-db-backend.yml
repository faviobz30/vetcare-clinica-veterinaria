services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: vetcare
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - vetcare_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vetcare"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    image: vetcare-backend:local
    environment:
      DB_URL: jdbc:postgresql://db:5432/vetcare
      DB_USER: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SPRING_FLYWAY_ENABLED: "true"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  vetcare_postgres_data: