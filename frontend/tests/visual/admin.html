const users=[{idUsuario:1,nombres:'Ana',apellidos:'Administración sintética',tipoDocumento:'PRUEBA',nroDocumento:'A001',correo:'admin@example.invalid',rol:'ADMIN',idRol:1,nroCelular:'999888777'},{idUsuario:2,nombres:'Cuenta',apellidos:'Propietaria sintética',tipoDocumento:'PRUEBA',nroDocumento:'P001',correo:'owner@example.invalid',rol:'PROPIETARIO',idRol:2,nroCelular:'999111222'},{idUsuario:3,nombres:'Sofía',apellidos:'Veterinaria sintética',tipoDocumento:'PRUEBA',nroDocumento:'V001',correo:'vet@example.invalid',rol:'VETERINARIO',idRol:3,nroCelular:'999222333'}]

api.defaults.adapter=async config=>{const url=config.url,method=config.method,body=typeof config.data==='string'?JSON.parse(config.data):config.data;let data
 if(url.includes('/foto'))reject(404,'Sin fotografía sintética')
 if(method==='get')data=({'/usuarios/me':users[0],'/usuarios':users,'/veterinarios':vets,'/propietarios':owners,'/mascotas':pets,'/citas':citas,'/atenciones':visits,'/citas/regularizaciones':[],'/atenciones/8':visits[0],'/vacunas/mascota/5':[]})[url]
 else{writes.push({url,method,body});if(url==='/veterinarios/3'&&method==='put'){Object.assign(vets[0],{especialidad:body.especialidad,nroColegiatura:body.nroColegiatura,tratamientoProfesional:body.tratamientoProfesional||null});if(body.datosUsuario)Object.assign(users[2],body.datosUsuario);data=vets[0]}else if(url==='/usuarios/me'&&method==='patch'){Object.assign(users[0],{nroCelular:body.nroCelular??users[0].nroCelular,direccionContacto:body.direccion??users[0].direccionContacto});data=users[0]}else if(url==='/citas/6/confirmar'){citas[0].estado='CONFIRMADA';data=citas[0]}}
 if(data===undefined)reject(404,'QA: solicitud no prevista; ninguna conexión externa')
 return {data:structuredClone(data),status:200,statusText:'OK',headers:{},config}}
const wait=async fn=>{for(let i=0;i<160;i++){if(fn())return;await new Promise(r=>setTimeout(r,25))}throw Error('Tiempo agotado')},button=(text,scope=document)=>[...scope.querySelectorAll('button')].find(b=>b.textContent.trim()===text),nav=text=>[...document.querySelectorAll('nav a')].find(a=>a.textContent===text),dialog=()=>document.querySelector('[role=dialog],dialog[open]')

async function choose(label,text){document.querySelector(`button[aria-label="${label}"]`).click();await wait(()=>document.querySelector('[role=option]'));[...document.querySelectorAll('[role=option]')].find(n=>n.textContent.includes(text)).click();await new Promise(r=>setTimeout(r,0))}
function fill(input,value){Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,'value').set.call(input,value);input.dispatchEvent(new Event('input',{bubbles:true}))}
async function run(){const checks=[],check=(v,text)=>{if(!v)throw Error(text);checks.push(text)};try{
 await wait(()=>document.querySelectorAll('.home-top-stat').length===4&&!document.querySelector('.home-top-stat').textContent.includes('…'));check(document.querySelector('.home-welcome').textContent.includes('¡Hola, Ana!'),'Nombre ADMIN del perfil');check(document.querySelector('.home-top-stat').textContent.includes('3'),'Contador desde respuesta');check([...document.querySelectorAll('nav a')].map(n=>n.textContent).join('|')==='Inicio|Mi perfil|Veterinarios|Usuarios|Propietarios|Citas|Atenciones','Siete rutas ADMIN');
 await page('Veterinarios');await wait(()=>button('Editar'));button('Editar').click();await wait(()=>dialog());await choose('Tratamiento profesional','Dr.');button('Guardar',dialog()).click();await wait(()=>!dialog());await wait(()=>document.querySelector('tbody').textContent.includes('Dr.'));check(vets[0].tratamientoProfesional==='Dr.','Tratamiento guardado y listado actualizado');check(writes[0].body.datosUsuario.correo==='vet@example.invalid','Identidad conservada en edición');button('Registrar veterinario').click();await wait(()=>dialog());check(dialog().textContent.includes('Tratamiento profesional'),'Creación incluye tratamiento');const before=writes.length;button('Cancelar',dialog()).click();await wait(()=>!dialog());check(writes.length===before,'Cancelar no escribe');
 await page('Usuarios');await wait(()=>document.querySelectorAll('tbody tr').length===3);fill(document.querySelector('[aria-label="Buscar usuarios"]'),'No existe');await wait(()=>document.querySelector('tbody').textContent.includes('Sin usuarios'));check(true,'Búsqueda usuarios');
 await page('Propietarios');await wait(()=>button('Ver propietario'));button('Ver propietario').click();await wait(()=>dialog());check(dialog().textContent.includes('owner@example.invalid')&&dialog().textContent.includes('Paciente sintético'),'Propietario, contacto y mascotas');button('Cerrar',dialog()).click();
 await page('Citas','Citas veterinarias');await wait(()=>button('Ver cita'));check(!!document.querySelector('[aria-label="Filtrar veterinario"]')&&!!document.querySelector('[aria-label="Fecha de cita"]'),'Filtros administrativos de citas');check(!button('Registrar atención'),'ADMIN no registra clínica desde agenda');button('Ver cita').click();await wait(()=>dialog());check(dialog().textContent.includes('Propietario'),'Detalle de cita');button('Cerrar',dialog()).click();
 await page('Atenciones','Atenciones clínicas');await wait(()=>button('Ver detalle'));check(!button('Editar')&&!button('Eliminar'),'Consulta clínica administrativa');check(!!button('Asignar precio'),'Precio administrativo conservado');button('Ver detalle').click();await wait(()=>dialog()?.textContent.includes('Diagnóstico sintético'));check(true,'Detalle clínico');document.querySelector('[aria-label="Cerrar detalle"]').click();
 await page('Mi perfil');await wait(()=>button('Editar información'));button('Editar información').click();const fields=[...document.querySelectorAll('form input')];fill(fields[0],'999333444');await new Promise(r=>setTimeout(r,0));button('Guardar').click();await wait(()=>!button('Guardar'));check(users[0].nroCelular==='999333444','Contacto ADMIN guardado');check(!('nombres' in writes.at(-1).body)&&!('idRol'in writes.at(-1).body),'Sin identidad ni rol en contacto');nav('Inicio').click();await wait(()=>document.querySelector('.home-welcome'));check(document.documentElement.scrollWidth<=innerWidth,'Sin desbordamiento');document.getElementById('qa-result').textContent=checks.length+' verificaciones correctas · '+checks.join(' · ')
 }catch(error){document.getElementById('qa-result').textContent='FALLO: '+error.message+' · '+checks.join(' · ')}}
createRoot(document.getElementById('root')).render(h(AuthProvider,null,h(MemoryRouter,{initialEntries:['/panel']},h('div',null,h('div',{className:'qa-tools',style:{padding:8,fontSize:12}},'QA AISLADA · Datos sintéticos · Sin API ni PostgreSQL ',h('button',{className:'btn btn-ghost',onClick:run},'Comprobar ADMIN'),h('output',{id:'qa-result'})),h(Routes,null,h(Route,{path:'/panel',element:h(Shell)},h(Route,{index:true,element:h(Home)}),...[['perfil',Perfil],['veterinarios',Veterinarios],['usuarios',Usuarios],['propietarios',Propietarios],['citas',Citas],['atenciones',Atenciones]].map(([path,Component])=>h(Route,{key:path,path,element:h(Component)}))))))))
