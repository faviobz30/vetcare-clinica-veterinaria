<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QA aislada · Vacunación clínica</title><body style="background:#F8F7FC"><div id="root"></div><script type="module">
import React,{useState} from 'react'
import {createRoot} from 'react-dom/client'
import ClinicalVaccination from '/src/components/ClinicalVaccination.jsx'
import {api} from '/src/lib/api.js'
import {limaToday} from '/src/lib/clinicalHistory.js'
import {vaccinationPayload,vaccinationDateLabel} from '/src/lib/clinicalVaccination.js'
import '/src/index.css'
const h=React.createElement,today=limaToday(),future=new Date(Date.parse(today+'T12:00:00Z')+86400000).toISOString().slice(0,10),pending=[{idVacuna:9,idMascota:1,idVeterinario:51,nombre:'Antirrábica sintética',proximaDosis:future,observaciones:'Traer cartilla. Indicación sintética áéíóúñ'}]
let writes=0
api.defaults.adapter=async config=>{if(config.method!=='get'||config.url!=='/vacunas/mascota/1'){writes++;throw Error('Solicitud bloqueada: QA sin servidor ni PostgreSQL')}return {data:structuredClone(pending),status:200,statusText:'OK',headers:{},config}}
function App(){const [rows,setRows]=useState([]),[loaded,setLoaded]=useState([]);return h('main',{style:{maxWidth:640,margin:'24px auto',padding:16,background:'white',borderRadius:24}},h('h1',{className:'text-2xl font-bold mb-3'},'Registrar atención clínica'),h('p',{className:'text-sm mb-4'},'QA AISLADA · Datos sintéticos · Sin API ni PostgreSQL'),h('button',{type:'button',className:'btn btn-ghost',onClick:run},'Comprobar vacunación'),h('output',{id:'qa-result',style:{display:'block',fontSize:12,margin:'12px 0'}}),h('form',{onSubmit:e=>{e.preventDefault();document.getElementById('payload').textContent=JSON.stringify(vaccinationPayload(rows,loaded,today))}},h(ClinicalVaccination,{petId:1,vetId:51,rows,onChange:setRows,onPending:setLoaded,busy:false}),h('button',{className:'btn btn-primary mt-4'},'Comprobar envío local')),h('pre',{id:'payload',style:{whiteSpace:'pre-wrap',overflowWrap:'anywhere',fontSize:12}}))}
const wait=async fn=>{for(let i=0;i<120;i++){if(fn())return;await new Promise(r=>setTimeout(r,25))}throw Error('Tiempo agotado')},button=text=>[...document.querySelectorAll('button')].find(b=>b.textContent.trim()===text)
async function choose(label,option){document.querySelector(`[aria-label="${label}"]`).click();await wait(()=>document.querySelector('[role=option]'));[...document.querySelectorAll('[role=option]')].find(n=>n.textContent.includes(option)).click();await new Promise(r=>setTimeout(r,0))}
async function run(){const checks=[],check=(v,name)=>{if(!v)throw Error(name);checks.push(name)};try{
 await wait(()=>document.querySelector('.clinical-vaccine-pending'));check(document.querySelector('.clinical-vaccine-pending').textContent.includes('Vacuna pendiente del paciente: 1'),'Singular correcto');check(document.querySelector('.clinical-vaccine-pending').textContent.includes(vaccinationDateLabel(future)),'Fecha programada legible');button('Comprobar envío local').click();await wait(()=>document.getElementById('payload').textContent==='[]');check(true,'Sin vacunas: envío vacío');button('Agregar vacuna').click();await wait(()=>document.querySelector('fieldset'));check(!!button('Agregar otra vacuna'),'Agregar otra vacuna');check(!document.querySelector('select'),'Selectores consistentes');await choose('¿Qué vacuna se administró? Vacuna 1','Antirrábica');check(document.querySelector('textarea').value===pending[0].observaciones,'Indicaciones recuperadas');check(!document.querySelector('input[maxlength="120"]'),'Sin pedir nombre nuevamente');button('Comprobar envío local').click();await wait(()=>document.getElementById('payload').textContent.includes('"idVacunaProgramada":9'));check(document.getElementById('payload').textContent.includes('"fechaAplicacion":"'+today+'"'),'Aplicación conserva fecha efectiva');
 document.querySelector('[aria-label="Fecha efectiva de aplicación. Vacuna 1"]').click();await wait(()=>document.querySelector('.clinical-vaccine-calendar'));const futureButton=document.querySelector(`.clinical-vaccine-calendar button[aria-label="${vaccinationDateLabel(future)}"]`);check(!futureButton||futureButton.disabled,'Futuro no elegible en aplicación');button('Cerrar calendario').click();await choose('¿Qué deseas hacer? Vacuna 1','Programar una vacuna futura');check(!document.querySelector('[aria-label="Fecha efectiva de aplicación. Vacuna 1"]'),'Programación sin fecha de aplicación');const input=document.querySelector('input[maxlength="120"]');const setter=Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,'value').set;setter.call(input,'Séxtuple sintética');input.dispatchEvent(new Event('input',{bubbles:true}));document.querySelector('[aria-label="Fecha programada. Vacuna 1"]').click();await wait(()=>document.querySelector('.clinical-vaccine-calendar'));const next=document.querySelector(`.clinical-vaccine-calendar button[aria-label="${vaccinationDateLabel(future)}"]`);if(next){check(!next.disabled,'Futuro permitido al programar');next.click()}else throw Error('Fecha futura no visible');await new Promise(r=>setTimeout(r,0));button('Comprobar envío local').click();await wait(()=>document.getElementById('payload').textContent.includes('"aplicada":false'));check(document.getElementById('payload').textContent.includes('"fechaAplicacion":null'),'Programación no es aplicación');button('Agregar otra vacuna').click();await wait(()=>document.querySelectorAll('fieldset').length===2);check(true,'Múltiples vacunas');button('Quitar vacuna').click();await wait(()=>document.querySelectorAll('fieldset').length===1);check(writes===0,'Quitar solo modifica borrador');check(!document.querySelector('select')&&!document.querySelector('input[type=date]'),'Sin menús nativos');check(document.documentElement.scrollWidth<=innerWidth,'Sin desbordamiento horizontal');document.getElementById('qa-result').textContent=checks.length+' verificaciones correctas · '+checks.join(' · ')
}catch(error){document.getElementById('qa-result').textContent='FALLO: '+error.message+' · '+checks.join(' · ')}}
if(new URLSearchParams(location.search).has('captura')){const style=document.createElement('style');style.textContent='main>button,main>output,main>pre{display:none!important}';document.head.append(style)}
createRoot(document.getElementById('root')).render(h(App))
if(new URLSearchParams(location.search).has('auto')){await wait(()=>button('Comprobar vacunación'));button('Comprobar vacunación').click()}
</script></body></html>
