<!doctype html><html lang="es"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QA aislada · Citas</title><style>.capture .qa-tools{display:none}</style><body><div id="root"></div><script type="module">
// Adaptador de revisión aislada; ninguna llamada llega al backend ni a PostgreSQL.

const h=React.createElement,q=new URLSearchParams(location.search),today=limaToday(),day=n=>{const d=new Date(today+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)}

let role=q.get('role')==='vet'?'VETERINARIO':'PROPIETARIO',setRole,writes=0,fail=false,authVersion=0
function auth(value){role=value;const token=['qa',btoa(JSON.stringify({idUsuario:value==='PROPIETARIO'?601:501,rol:value,sub:'qa@example.invalid',exp:4102444800})),'qa'].join('.');sessionStorage.setItem('vetcare_token',token);sessionStorage.setItem('vetcare_role',value);setRole?.(value+'-'+(++authVersion))}auth(role)
const pets=[{idMascota:1,idPropietario:1,nombre:'Mora',especie:'Canina',raza:'Mestiza',nombrePropietario:'Ana Herrera',fechaNacimiento:'2022-05-15',sexo:'Hembra',tieneFoto:false},{idMascota:2,idPropietario:1,nombre:'Kiro',especie:'Felina',raza:'Mestizo',nombrePropietario:'Ana Herrera',tieneFoto:false},{idMascota:3,idPropietario:2,nombre:'Nube',especie:'Canina',nombrePropietario:'Luis Prado',tieneFoto:false}]
const vets=[{idVeterinario:51,nombres:'Elena',apellidos:'Ruiz',especialidad:'Medicina veterinaria general'},{idVeterinario:52,nombres:'Martín',apellidos:'Vega',especialidad:'Cirugía veterinaria'}]
let rows=[{idCita:1,idMascota:1,idVeterinario:51,fechaCita:day(1)+'T09:00:00',estado:'CONFIRMADA',motivoCita:'Consulta de seguimiento de prueba'},{idCita:2,idMascota:2,idVeterinario:51,fechaCita:day(2)+'T11:30:00',estado:'PENDIENTE',motivoCita:'Evaluación registrada de prueba'},{idCita:3,idMascota:1,idVeterinario:51,fechaCita:new Date(Date.now()-5*3600000-5*60000).toISOString().slice(0,19),estado:'CONFIRMADA',puedeIniciarAtencion:true,puedeGuardarAtencion:true,motivoCita:'Control clínico de prueba'},{idCita:4,idMascota:3,idVeterinario:51,fechaCita:today+'T10:00:00',estado:'PENDIENTE',motivoCita:'Consulta sintética'},{idCita:5,idMascota:2,idVeterinario:51,fechaCita:day(-2)+'T10:00:00',estado:'ATENDIDA',motivoCita:'Atención documentada en prueba'},{idCita:6,idMascota:1,idVeterinario:51,fechaCita:today+'T15:00:00',estado:'CANCELADA',motivoCita:'Cita cancelada de prueba'},{idCita:7,idMascota:1,idVeterinario:52,fechaCita:day(-4)+'T11:00:00',estado:'ATENDIDA',motivoCita:'Revisión anterior de prueba'}]

api.defaults.adapter=async config=>{
 const url=config.url,method=config.method,body=typeof config.data==='string'?JSON.parse(config.data):config.data;let data
 if(method!=='get'){
  writes++;await new Promise(r=>setTimeout(r,150));if(fail){fail=false;reject(409,'Conflicto de prueba: horario ocupado',config)}

  else if(url==='/citas'){data={...body,idCita:Math.max(...rows.map(c=>c.idCita))+1,estado:'PENDIENTE'};rows.push(data)}
  else if(url==='/atenciones'){const c=rows.find(c=>c.idCita===body.idCita);if(c.estado!=='CONFIRMADA')reject(409,'Cita no confirmada',config);data={...body,idAtencion:Math.max(...visits.map(a=>a.idAtencion))+1,fechaAtencion:today+'T12:00:00'};visits.push(data);c.estado='ATENDIDA'}
  else {const c=rows.find(c=>c.idCita===Number(url.split('/')[2]));if(!c||!visible(c))reject(403,'No autorizado',config);if(['ATENDIDA','CANCELADA'].includes(c.estado))reject(409,'Cita cerrada',config);if(url.endsWith('/confirmar'))c.estado='CONFIRMADA';else if(url.endsWith('/cancelar'))c.estado='CANCELADA';else Object.assign(c,body);data=c}
 }else if(url==='/citas/disponibilidad'){const day=config.params.fecha;data={idVeterinario:Number(config.params.idVeterinario),fecha:day,zonaHoraria:'America/Lima',apertura:'08:00:00',cierre:'20:00:00',horarios:Array.from({length:24},(_,i)=>({inicio:day+'T'+String(8+Math.floor(i/2)).padStart(2,'0')+':'+(i%2?'30':'00')+':00',disponible:true}))}}
 else if(url==='/usuarios/me')data={idUsuario:role==='PROPIETARIO'?601:501,nombres:role==='PROPIETARIO'?'Ana':'Elena',apellidos:role==='PROPIETARIO'?'Herrera':'Ruiz',rol:role,nroCelular:'000000000'}
 else if(url==='/propietarios/me')data={idPropietario:1}
 else if(url==='/veterinarios/me')data=vets[0]
 else if(url==='/veterinarios')data=vets
 else if(url==='/mascotas')data=role==='PROPIETARIO'?pets.filter(p=>p.idPropietario===1):pets
 else if(url==='/citas')data=rows.filter(visible)
 else if(/^\/citas\/\d+$/.test(url)){data=rows.find(c=>c.idCita===Number(url.split('/')[2]));if(!visible(data))reject(403,'No autorizado',config)}
 else if(url==='/atenciones')data=visits.filter(a=>visible(rows.find(c=>c.idCita===a.idCita)))
 else if(/^\/atenciones\/\d+$/.test(url))data=visits.find(a=>a.idAtencion===Number(url.split('/')[2]))
 else if(url.startsWith('/historias-clinicas/mascota/')){const id=Number(url.split('/').at(-1));data={idHistoria:id*10,idMascota:id,nombreMascota:pets.find(p=>p.idMascota===id)?.nombre,fechaApertura:today+'T08:00:00',antecedentes:{estadoAlergias:'NO_EVALUADAS'}}}
 else if(/^\/mascotas\/\d+$/.test(url))data=pets.find(p=>p.idMascota===Number(url.split('/').at(-1)))
 else if(url==='/recordatorios'||url.startsWith('/vacunas/mascota/'))data=[]
 if(data===undefined)reject(404,'No disponible en revisión aislada',config)
 return {data:structuredClone(data),status:200,statusText:'OK',config,headers:{}}
}
function App(){const [identity,update]=useState(role);setRole=update;return h(AuthProvider,{key:identity},h(MemoryRouter,{initialEntries:['/panel/citas']},h('div',null,h('p',{style:{padding:10,color:'#6B7280',fontSize:12}},'PRUEBAS AISLADAS · Datos sintéticos · Sin API ni PostgreSQL'),h('div',{className:'qa-tools'},h('button',{onClick:()=>auth(role==='PROPIETARIO'?'VETERINARIO':'PROPIETARIO')},'Cambiar rol'),h('button',{onClick:run},'Comprobar flujos'),h('output',{id:'qa-result'})),h(Routes,null,h(Route,{element:h(Shell)},h(Route,{path:'/panel/citas',element:h(Citas)}),h(Route,{path:'/panel/historias',element:h(HistoriaClinica)}))))))}
const wait=async pred=>{for(let i=0;i<350;i++){if(pred())return;await new Promise(r=>setTimeout(r,20))}throw Error('Tiempo agotado')}
const button=(text,scope=document)=>[...scope.querySelectorAll('button')].find(b=>b.textContent.trim()===text)
function fill(node,value){Object.getOwnPropertyDescriptor(node.tagName==='TEXTAREA'?HTMLTextAreaElement.prototype:node.tagName==='SELECT'?HTMLSelectElement.prototype:HTMLInputElement.prototype,'value').set.call(node,value);node.dispatchEvent(new Event('input',{bubbles:true}));node.dispatchEvent(new Event('change',{bubbles:true}))}
const field=text=>[...document.querySelectorAll('[role=dialog] label')].find(l=>l.textContent.includes(text))?.querySelector('input,textarea')
async function choose(label,text){document.querySelector(`button[aria-label="${label}"]`).click();await wait(()=>document.querySelector('[role=option]'));[...document.querySelectorAll('[role=option]')].find(n=>n.textContent===text||n.textContent.includes(text)).click();await new Promise(r=>setTimeout(r,0))}
async function pickDate(day){document.querySelector('button[aria-label="Fecha y hora (Lima) *"]').click();await wait(()=>document.querySelector('.appointment-availability-content'));document.querySelector('.appointment-availability-content [aria-label="Mes siguiente"]').click();await new Promise(r=>setTimeout(r,0));[...document.querySelectorAll('.vet-datetime-day')].find(n=>n.textContent===String(day)).click();await new Promise(r=>setTimeout(r,0));await wait(()=>document.querySelector('.appointment-slots button:not(:disabled)'));document.querySelector('.appointment-slots button:not(:disabled)').click();await new Promise(r=>setTimeout(r,0))}
async function run(){let passed=[];const check=(ok,label)=>{if(!ok)throw Error(label);passed.push(label)};try{
 rows=structuredClone(initialRows);visits=structuredClone(initialVisits);writes=0;fail=false;auth('PROPIETARIO');await new Promise(r=>setTimeout(r,0));await wait(()=>button('Nueva cita')&&!button('Nueva cita').disabled);check(document.querySelectorAll('.appointments-main .appointments-pet').length>0,'Todas identifica mascotas')
 await choose('Mascota','Mora');await wait(()=>!document.querySelector('.appointments-owner-row .appointments-pet'));check(!document.querySelector('.appointments-owner-row .appointments-pet'),'Mascota específica no repite identidad');await choose('Mascota','Todas las mascotas')
 await choose('Estado de cita','Canceladas');await wait(()=>document.querySelector('.appointments-main').textContent.includes('Citas canceladas'));check(![...document.querySelectorAll('.appointments-row-actions button')].some(b=>['Cancelar','Reprogramar'].includes(b.textContent.trim())),'Cancelada sin escrituras');await choose('Estado de cita','Todos los estados')
 button('Nueva cita').click();await wait(()=>field('Motivo'));await choose('Mascota *','Mora');await choose('Veterinario *','Elena');await pickDate(20);fill(field('Motivo'),'Cita del recorrido aislado');await new Promise(r=>setTimeout(r,0));let n=writes;button('Solicitar cita').click();button('Guardando...')?.click();await wait(()=>!document.querySelector('[role=dialog]'));check(writes===n+1,'Nueva cita sin doble envío');const created=rows.find(c=>c.motivoCita==='Cita del recorrido aislado');check(!!created,'Creación mediante adaptador')
 await wait(()=>document.querySelector(`.appointments-owner-row[data-cita="${created.idCita}"]`));button('Reprogramar',document.querySelector(`.appointments-panel [data-cita="${created.idCita}"]`)).click();await wait(()=>field('Motivo'));await pickDate(21);button('Guardar cambios').click();await wait(()=>!document.querySelector('[role=dialog]'));check(created.fechaCita.slice(8,10)==='21','Reprogramación mismo registro')
 await wait(()=>button('Cancelar',document.querySelector('.appointments-panel [data-cita="2"]'))&&!button('Cancelar',document.querySelector('.appointments-panel [data-cita="2"]')).disabled);const cancelRow=document.querySelector('.appointments-panel [data-cita="2"]');button('Cancelar',cancelRow).click();await wait(()=>document.querySelector('[role=dialog]'));fill(document.querySelector('[role=dialog] select'),'Motivos personales.');await new Promise(r=>setTimeout(r,0));button('Confirmar cancelación',document.querySelector('[role=dialog]')).click();await wait(()=>!document.querySelector('[role=dialog]'));check(rows.find(c=>c.idCita===2).estado==='CANCELADA','Cancelación confirmada')

 button('Todas').click();await wait(()=>document.querySelector('[data-cita="3"]'));row=document.querySelector('[data-cita="3"]');button('Registrar atención',row).click();await wait(()=>field('Peso'));await wait(()=>!button('Guardar atención').disabled);for(const [key,value] of [['Peso','12.6'],['Síntomas','Síntoma sintético'],['Diagnóstico','Diagnóstico de prueba'],['Tratamiento','Tratamiento de prueba'],['Observaciones','Observación de prueba']])fill(field(key),value);await new Promise(r=>setTimeout(r,0));button('Guardar atención').click();await wait(()=>!document.querySelector('[role=dialog]'));check(rows.find(c=>c.idCita===3).estado==='ATENDIDA','Atención usa flujo existente');await wait(()=>button('Ver atención',document.querySelector('[data-cita="3"]')));button('Ver atención',document.querySelector('[data-cita="3"]')).click();await wait(()=>document.querySelector('[role=dialog]')?.textContent.includes('Diagnóstico de prueba'));check(true,'Detalle clínico real del adaptador');document.querySelector('[aria-label="Cerrar detalle"]').click();await wait(()=>!document.querySelector('[role=dialog]'))
 fill(document.querySelector('[aria-label="Buscar paciente o propietario"]'),'Nube');await wait(()=>document.querySelectorAll('.appointments-agenda-row').length===1);check(document.querySelector('.appointments-agenda-row').textContent.includes('Luis Prado'),'Búsqueda paciente y propietario');fill(document.querySelector('[aria-label="Buscar paciente o propietario"]'),'');button('Ver agenda del día').click();await wait(()=>document.querySelector('[aria-pressed=true]').textContent==='Hoy');check(true,'Acceso agenda del día')

createRoot(document.getElementById('root')).render(h(App))
</script></body></html>
