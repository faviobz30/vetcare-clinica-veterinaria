<!doctype html><html lang="es"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QA aislada · Perfil ADMIN</title><style>.capture .qa-tools{display:none}</style><body><div id="root"></div><script type="module">

 fill(field('Celular'),'912345678');await tick();check(!document.getElementById('admin-phone-error'),'Error se limpia al corregir');fill(field('Dirección'),'Calle sintética 200');await tick();btn('Guardar').click();btn('Guardar').click();await wait(()=>document.querySelector('[role=status]')?.textContent.includes('guardados'))
 check(writes===before+1,'Un PATCH frente a doble clic');check(profile.nroCelular==='912345678'&&profile.direccionContacto==='Calle sintética 200','Contacto guardado');check(!field('Celular'),'Retorno a lectura')
 btn('Editar información').click();await tick();fill(field('Dirección'),'No guardar');await tick();failPatch=true;btn('Guardar').click();await wait(()=>document.querySelector('[role=alert]'));check(profile.direccionContacto==='Calle sintética 200'&&field('Dirección').value==='No guardar','PATCH fallido conserva borrador');btn('Cancelar').click();await tick();check(!document.querySelector('[role=alert]'),'Cancelar limpia error')
 btn('Editar información').click();await tick();fill(field('Dirección'),'Guardado con consulta fallida');await tick();failRefresh=true;btn('Guardar').click();await wait(()=>document.querySelector('[role=alert]')?.textContent.includes('se guardaron'))
 check(profile.direccionContacto==='Guardado con consulta fallida','Fallo de consulta no revierte guardado');check(document.querySelector('.profile-form-grid').textContent.includes('Guardado con consulta fallida'),'Vista conserva respuesta PATCH');btn('Reintentar consulta').click();await wait(()=>!document.querySelector('[role=alert]')&&!btn('Cambiar foto').disabled)

 document.querySelector('button[aria-label="Opciones de perfil"]').click();await tick();const headerInput=document.querySelector('header input[type=file]');const transfer=new DataTransfer();transfer.items.add(file);before=writes;headerInput.files=transfer.files;headerInput.dispatchEvent(new Event('change',{bubbles:true}));await wait(()=>document.querySelector('dialog[open]'));check(writes===before,'Encabezado también requiere vista previa');btn('Cancelar',document.querySelector('dialog')).click();await tick();check(writes===before,'Cancelar foto de encabezado sin escritura');
