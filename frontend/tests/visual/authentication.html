<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QA aislada · Autenticación VetCare</title><body><div id="root"></div><script type="module">

const h=React.createElement,q=new URLSearchParams(location.search),token='T'.repeat(43),first='Consulta@Segura37',next='Otra@Cuenta38',roleOf=email=>email.startsWith('admin')?'ADMIN':email.startsWith('vet')?'VETERINARIO':'PROPIETARIO'

const reject=(status,error)=>{throw {response:{status,data:{error}}}}
api.defaults.adapter=async config=>{const body=typeof config.data==='string'?JSON.parse(config.data):config.data;let data;const url=config.url
 if(config.method==='post'){writes.push({url,body});await new Promise(r=>setTimeout(r,20))
  if(url==='/auth/registro'){if(body.contrasena!==first)reject(400,'Revisa la contraseña');data={rol:'PROPIETARIO'}}
  else if(url==='/auth/login'){if(body.contrasena!==currentPassword)reject(401,'Credenciales inválidas');lastRole=roleOf(body.correo);data={token:['qa',btoa(JSON.stringify({idUsuario:1,rol:lastRole,exp:4102444800})),'qa'].join('.')}}
  else if(url==='/auth/recuperar-contrasena'){if(disabled)reject(503,'Correo no configurado');data={mensaje:'Solicitud recibida para su procesamiento. Si el correo está registrado, recibirás instrucciones para restablecer tu contraseña.'}}
  else if(url==='/auth/restablecer-contrasena'){if(body.token!==token||used)reject(400,'El enlace no es válido, ya fue utilizado o venció. Solicita uno nuevo.');used=true;currentPassword=body.contrasena;data={mensaje:'Contraseña actualizada. Ya puedes iniciar sesión.'}}
 }else if(url==='/usuarios/me')data={idUsuario:1,nombres:'Cuenta',apellidos:'Sintética',correo:'qa@example.invalid',rol:lastRole}
 else if(url==='/propietarios/me')data={idPropietario:2}
 else if(url==='/veterinarios/me')data={idVeterinario:3,tratamientoProfesional:null}
 else if(url==='/usuarios/me/foto')reject(404,'Sin fotografía')

 return {data,status:config.method==='post'&&url.includes('recuperar')?202:200,statusText:'OK',headers:{},config}
}
function Panel(){const {user,logout}=useAuth(),navigate=useNavigate();return h('main',null,h('h1',null,'Dashboard de '+user?.role),h('button',{onClick:()=>{logout();navigate('/login')}},'Cerrar sesión'))}
function Tools(){const navigate=useNavigate(),loc=useLocation();return h('div',{className:'qa-tools'},h('p',null,'QA AISLADA · Datos sintéticos · Sin API ni PostgreSQL'),...['login','registro','recuperar-contrasena','restablecer-contrasena'].map(path=>h('button',{key:path,onClick:()=>navigate('/'+path+(path.startsWith('restablecer')?'#token='+token:''))},'Abrir '+path)),h('button',{onClick:run},'Comprobar autenticación'),h('output',{id:'qa-result'}),h('span',{id:'qa-route','data-route':loc.pathname,'data-hash-present':String(!!loc.hash)},loc.pathname))}
const wait=async fn=>{for(let i=0;i<180;i++){if(fn())return;await new Promise(r=>setTimeout(r,25))}throw Error('Tiempo agotado')},button=(text)=>[...document.querySelectorAll('button')].find(n=>n.textContent.trim()===text),label=text=>[...document.querySelectorAll('.auth-field')].find(n=>n.querySelector('label')?.textContent===text)?.querySelector('input'),link=text=>[...document.querySelectorAll('.auth-links a')].find(n=>n.textContent===text)

async function open(path){button('Abrir '+path).click();await wait(()=>document.getElementById('qa-route').dataset.route==='/'+path);await new Promise(r=>setTimeout(r,0))}

async function run(){const checks=[],check=(v,name)=>{if(!v)throw Error(name);checks.push(name)};try{

 await open('registro');const order=[...document.querySelectorAll('.auth-field label,.auth-field>span')].map(n=>n.textContent);check(order.indexOf('Celular')<order.indexOf('Correo electrónico')&&order.indexOf('Dirección')<order.indexOf('Contraseña'),'Orden obligatorio de campos');check(!document.querySelector('.auth-frame').textContent.includes('/api/'),'Sin texto técnico');check(document.querySelectorAll('.auth-corner-paw').length===1,'Huella decorativa visible')
 for(const [name,value] of [['Nombres','Persona'],['Apellidos','Sintética'],['Número de documento','12345678'],['Celular','999888777'],['Dirección','Dirección sintética'],['Correo electrónico','owner@example.invalid'],['Contraseña',first],['Confirmar contraseña',first]])fill(label(name),value)

 const show=document.querySelector('[aria-label="Mostrar contraseña"]');show.click();await wait(()=>label('Contraseña').type==='text');check(true,'Mostrar contraseña');document.querySelector('[aria-label="Ocultar contraseña"]').click();await wait(()=>label('Contraseña').type==='password');check(true,'Ocultar contraseña');
 for(const [email,role] of [['admin@example.invalid','ADMIN'],['vet@example.invalid','VETERINARIO'],['owner@example.invalid','PROPIETARIO']]){await login(email,first);await wait(()=>document.querySelector('h1')?.textContent==='Dashboard de '+role);check(true,'Login y redirección '+role);button('Cerrar sesión').click();await wait(()=>document.getElementById('qa-route').dataset.route==='/login');check(!sessionStorage.getItem('vetcare_token'),'Logout '+role)}

 await open('recuperar-contrasena');fill(label('Correo electrónico'),'owner@example.invalid');await new Promise(r=>setTimeout(r,0));disabled=true;button('Enviar instrucciones').click();await wait(()=>document.querySelector('[role=alert]'));check(!document.querySelector('[role=status]'),'Correo deshabilitado no simula envío');disabled=false;button('Enviar instrucciones').click();await wait(()=>document.querySelector('[role=status]'));check(document.querySelector('[role=status]').textContent.includes('Si el correo está registrado'),'Mensaje neutral y procesamiento');
 await open('restablecer-contrasena');await wait(()=>document.getElementById('qa-route').dataset.hashPresent==='false');check(!document.getElementById('qa-route').textContent.includes(token),'Token no expuesto en pantalla');fill(label('Nueva contraseña'),next);fill(label('Confirmar nueva contraseña'),first);await new Promise(r=>setTimeout(r,0));button('Guardar nueva contraseña').click();await wait(()=>document.querySelector('[role=alert]'));check(document.querySelector('[role=alert]').textContent.includes('no coinciden'),'Confirmación de contraseña');fill(label('Confirmar nueva contraseña'),next);await new Promise(r=>setTimeout(r,0));button('Guardar nueva contraseña').click();await wait(()=>document.querySelector('[role=status]'));check(document.querySelector('[role=status]').textContent.includes('actualizada'),'Restablecimiento confirmado');link('Iniciar sesión').click();await wait(()=>label('Correo electrónico'));await login('owner@example.invalid',first);await wait(()=>document.querySelector('[role=alert]'));check(true,'Clave anterior rechazada');await login('owner@example.invalid',next);await wait(()=>document.querySelector('h1')?.textContent==='Dashboard de PROPIETARIO');check(true,'Login con clave nueva');button('Cerrar sesión').click();await wait(()=>document.getElementById('qa-route').dataset.route==='/login');check(document.documentElement.scrollWidth<=innerWidth,'Sin desbordamiento horizontal');document.getElementById('qa-result').textContent=checks.length+' verificaciones correctas · '+checks.join(' · ')
 }catch(error){document.getElementById('qa-result').textContent='FALLO: '+error.message+' · '+checks.join(' · ')}}
