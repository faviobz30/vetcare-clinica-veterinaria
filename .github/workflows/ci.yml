name: VetCare - CI

on:
  push:
    branches: [deploy-vetcare, main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend - Java 21
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar backend
        run: ./mvnw -B -DskipTests package

  frontend:
    name: Frontend - React
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar frontend
        run: npm run build

  docker:
    name: Docker - Verificar imagenes
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    env:
      POSTGRES_PASSWORD: clave-ficticia-solo-ci
      DB_PASSWORD: clave-ficticia-solo-ci
      JWT_SECRET: valor-ficticio-solo-para-validar-compose
      MAIL_PASSWORD: valor-ficticio-solo-ci
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Validar Compose
        run: docker compose config --quiet

      - name: Construir imagenes
        run: docker compose build backend frontend
